<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planner · Budget Planner</title>
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" aria-label="Pages">
        <a href="./index.html" aria-current="page">Planner</a>
        <a href="./import.html">Import</a>
      </nav>
    </header>
    <main class="page">
      <div class="page-head">
        <h1>Planner</h1>
        <a class="btn secondary" href="./import.html">Import bank CSV</a>
      </div>
      <section class="summary" id="summary" aria-label="Balance summary"></section>
      <div class="columns">
        <div class="stack">
          <section class="card" aria-labelledby="inputs-title">
            <h2 id="inputs-title">Inputs</h2>
            <div id="inputs"></div>
          </section>
          <section class="card" aria-labelledby="cards-title">
            <h2 id="cards-title">Cards</h2>
            <div id="cards"></div>
          </section>
        </div>
        <div class="stack">
          <section class="card" aria-labelledby="chart-title">
            <h2 id="chart-title">Balance chart</h2>
            <div id="chart"></div>
          </section>
          <section class="card" aria-labelledby="totals-title">
            <h2 id="totals-title">Totals</h2>
            <div id="totals"></div>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="/src/ui/planner.js"></script>
  </body>
</html>
