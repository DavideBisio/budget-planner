<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Import · Budget Planner</title>
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" aria-label="Pages">
        <a href="./index.html">Planner</a>
        <a href="./import.html" aria-current="page">Import</a>
      </nav>
    </header>
    <main class="page">
      <h1>Import</h1>
      <p class="lead">
        Turn bank statements into planner cards in seven steps. Your files stay in this browser.
        <span class="popover" data-popover>
          <button
            class="popover-trigger"
            type="button"
            aria-expanded="false"
            aria-controls="tip-file"
            aria-label="About privacy"
          >
            ?
          </button>
          <span class="popover-body" id="tip-file" role="tooltip" hidden>
            Files are read in your browser and never uploaded.
          </span>
        </span>
      </p>
      <div class="progress">
        <span class="progress-label" id="progress-label" role="status">0 of 7 steps ready</span>
        <progress aria-label="Steps ready" max="7" value="0"></progress>
      </div>
      <div class="columns">
        <div class="stack">
          <ol class="steps" id="steps"></ol>
        </div>
        <div class="stack" id="results">
          <section class="card" id="result-empty" aria-labelledby="result-title">
            <h2 id="result-title">Result</h2>
            <p>
              Choose a sample statement in step 1 or import files in step 2 to see results here.
            </p>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="/src/ui/import.js"></script>
  </body>
</html>
