<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Import · Budget Planner</title>
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" aria-label="Pages">
        <a href="./index.html">Planner</a>
        <a href="./import.html" aria-current="page">Import</a>
      </nav>
    </header>
    <main class="page" data-own-backup>
      <div class="page-head">
        <h1>Import</h1>
        <a class="btn secondary" href="./index.html">Budget Planner</a>
      </div>
      <p class="lead">
        Turn bank statements into planner cards in six steps. Your files stay in this browser.
        <span class="popover" data-popover>
          <button
            class="popover-trigger"
            type="button"
            aria-expanded="false"
            aria-controls="tip-file"
            aria-label="About privacy"
          >
            ?
          </button>
          <span class="popover-body" id="tip-file" role="tooltip" hidden>
            Files are read in your browser and never uploaded.
          </span>
        </span>
      </p>
      <div class="progress">
        <span class="progress-label" id="progress-label" role="status">0 of 6 steps done</span>
        <progress aria-label="Steps done" max="6" value="0"></progress>
      </div>
      <div class="step-tabs" id="tabs" role="tablist" aria-label="Import steps"></div>
      <p class="tabs-note" id="tabs-note" role="status" hidden></p>
      <div id="panels"></div>
    </main>
    <script type="module" src="/src/ui/import.js"></script>
  </body>
</html>
